name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows build and test
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.300

      - name: Restore
        run: dotnet restore Sasd.Pims.slnx

      - name: Build
        run: dotnet build Sasd.Pims.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Sasd.Pims.slnx -c Release --no-build
